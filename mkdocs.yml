# Project info
site_name: IBM Bob Premium Package for Z Level 3
site_description: IBM Bob Premium Package for Z Level 3
site_author: Christopher Bienko (cdbienko@us.ibm.com)
copyright: Copyright &copy; 2026 IBM

# Repository
repo_name: bienko/bob-ppz
#repo_url: https://github.com/bienko/bob-ppz
#edit_uri: edit/master/docs
docs_dir: docs

nav:
  - Table of Contents: toc.md
  - Introduction: index.md
  - Registration and setup:
    - For IBM regular employees: setup-ibmers.md
    - For IBM business partners: setup-partners.md
  - 1. Analyze:
    - Understanding the CICS banking sample application: analyze/1-1.md
  - 2. Build:
    - Implementing a new feature in COBOL: build/2-1.md
  - 3. Refactor:
    - Monolithic COBOL refactoring and service integration: refactor/3-1.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.footer
  palette:
      scheme: default

plugins:
  - mkdocs-video:
      is_video: True
      video_autoplay: False
  - macros
  - search
  - glightbox
  - print-site:
      add_to_navigation: false
      print_page_title: 'IBM Bob Premium Package for Z Level 3'
      add_print_site_banner: false
      # Table of contents
      add_table_of_contents: false
      toc_title: 'Table of Contents'
      toc_depth: 6
      # Content-related
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: false
      cover_page_template: ""
      path_to_pdf: ""
      include_css: true
      enabled: true

markdown_extensions:
  - sane_lists
  - pymdownx.details
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - tables

extra_css:
  - styles/override-print.css

extra_javascript:
  - _static/hide-toc-nav.js
